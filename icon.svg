<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Background Track Circle -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#1e293b" stroke-width="24" />

  <!-- Progress / History Arc -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#arcGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="911" stroke-dashoffset="240"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Play Symbol -->
  <polygon points="230,195 320,256 230,317" fill="#ffffff" />

  <!-- Watched Checkmark Badge -->
  <g transform="translate(365, 365)">
    <circle cx="0" cy="0" r="54" fill="#10b981" stroke="#0f172a" stroke-width="8"/>
    <path d="M-22,-2 L-6,14 L22,-16" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
